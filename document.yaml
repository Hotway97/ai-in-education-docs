# Порядок разделов статьи.
input-files:
  - article/00-title.md
  - article/01-contents.md
  - article/02-introduction.md
  - article/03-technologies.md
  - article/04-applications.md
  - article/05-limitations.md
  - article/06-conclusion.md
  - article/07-references.md
from: markdown+tex_math_single_backslash+raw_attribute
to: docx
output-file: article.docx
standalone: true
reference-doc: template.docx
filters: # обработчики
  - pandoc-crossref # для нумерации рисунков и таблиц
  - citeproc # для списка литературы
bibliography: bibliography.bib
csl: gost-r-7.0.100-2018.csl
fail-if-warnings: true
metadata:
  lang: ru-RU
  figureTitle: Рис.
  tableTitle: Таблица
  figPrefix: рис.
  tblPrefix: табл.
  titleDelim: "\u00A0—\u00A0"
